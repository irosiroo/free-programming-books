<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title | default: 'Free Programming Books' }}</title>
<meta name="description" content="{{ page.description | default: site.description | default: 'A curated collection of free programming books and learning resources.' | escape }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% seo %}
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Free Programming Books home">
      <span class="brand-mark">FP</span><span>Free Programming Books</span>
    </a>
    <nav aria-label="Primary">
      <a href="{{ '/explore/' | relative_url }}">Explore</a>
      <a href="{{ '/languages/' | relative_url }}">Languages</a>
      <a href="{{ '/subjects/' | relative_url }}">Subjects</a>
      <a href="https://github.com/irosiroo/free-programming-books">GitHub</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Toggle theme" data-theme-toggle>◐</button>
  </div>
</header>
<main>{{ content }}</main>
<footer class="site-footer"><div class="container footer-grid"><div><strong>Free Programming Books</strong><p>Open learning resources for programmers.</p></div><div><a href="https://github.com/irosiroo/free-programming-books">Repository</a><a href="{{ '/explore/' | relative_url }}">Explore</a><a href="{{ '/subjects/' | relative_url }}">Subjects</a></div></div><div class="container footer-bottom">Built from the open Free Programming Books repository.</div></footer>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
